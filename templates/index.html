<!doctype html>
<html>
  <head>
    <title>My Dashboard</title>
  </head>
  <body>
    <h1>My Dashboard</h1>

    {% if github %}
    <img src="{{ github.avatar_url }}" width="100" />
    <h2>{{ github.name }} (@{{ github.login }})</h2>
    <p>Followers: {{ github.followers }}</p>
    <p>Following: {{ github.following }}</p>
    <p>Public repos: {{ github.public_repos }}</p>
    {% else %}
    <p>Couldn't load GitHub data.</p>
    {% endif %}
  </body>
</html>
